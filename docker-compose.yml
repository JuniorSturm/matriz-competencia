services:

  postgres:
    image: postgres:16-alpine
    container_name: competency-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: competency_matrix
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Em produção: substitua Jwt__Secret por variável de ambiente ou arquivo .env não versionado.
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: competency-api
    environment:
      ASPNETCORE_URLS: "http://+:5000"
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=competency_matrix;Username=postgres;Password=postgres"
      Jwt__Secret: "CHANGE_ME_TO_A_VERY_LONG_SECRET_KEY_AT_LEAST_32_CHARS"
      Jwt__Issuer: "CompetencyMatrix"
      Jwt__Audience: "CompetencyMatrix"
      # Access token curto (15 min) para evitar ficar aceito por muitas horas sem renovação
      Jwt__ExpiryMinutes: "15"
      # Refresh token com 60 min e renovação em cada uso → até 1h de inatividade máxima
      Jwt__RefreshExpiryMinutes: "60"
      AllowedHosts: "*"
      # Configurações de e-mail (Brevo SMTP)
      Email__Host: "smtp-relay.brevo.com"
      Email__Port: "587"
      Email__User: "a53eb8001@smtp-brevo.com"
      Email__Password: "${BREVO_SMTP_KEY}"
      Email__From: "contato@jstrsystem.com.br"
      Email__Ssl: "true"
      # BaseUrl público usado para links enviados por e-mail
      Frontend__BaseUrl: "http://localhost:3000"
    ports:
      - "5100:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: competency-frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
