server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Evita cache do index.html (necessário para carregar a versão atual do bundle)
    location = /index.html {
        add_header Cache-Control "no-store, max-age=0, must-revalidate" always;
    }

    # Proxy API calls to the backend (direto para o serviço API na rede Docker)
    location /api/ {
        proxy_pass         http://api:5000/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
